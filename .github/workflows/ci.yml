# Builds the map in release mode, lints and tests it on Ubuntu and Windows,
# then attaches the packed archive to the run. `test:map` never runs here,
# and the workflow reads no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v7

      # No `version` input: the action reads it from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build --mode release

      - run: pnpm lint

      - run: pnpm test

      # The packed archive is the one top-level map file in the output folder
      # (`outputFolder` and `archiveName` in reforged.config.ts; `dist/staging` holds a folder, not a file).
      - name: Find the packed archive
        id: archive
        shell: bash
        run: |
          shopt -s nullglob
          files=()
          for f in dist/*.w3x dist/*.w3m; do
            [ -f "$f" ] && files+=("$f")
          done
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one packed archive in dist, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          file="${files[0]}"
          name="$(basename "$file")"
          echo "path=$file" >> "$GITHUB_OUTPUT"
          echo "map=${name%.*}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.map }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ runner.os }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
