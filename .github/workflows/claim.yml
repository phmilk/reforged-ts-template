# The claim check of this repository: on every pull request, drafts
# included, when it opens, reopens, is pushed or is edited, and on every
# assignment and unassignment of an issue, it runs the library's reusable
# claim-check.yml, which holds the logic, the texts and the reasons for its
# run shape. The check reports as `claim / check`; until the ruleset on
# main names it, a red check is advisory. docs/agents/issue-tracker.md,
# "Claim", holds the protocol.
#
# Template maintenance: a generated Map project deletes this file (see
# AGENTS.md). The job runs only in phmilk/reforged-ts-template, so a copy
# left in a generated project stays inert. The sync never touches it: the
# @master ref keeps it current.
name: claim

on:
  pull_request_target:
    # Drafts included: the collision begins at the draft. No base-branch
    # filter: a pull request to another branch closes nothing and passes.
    types: [opened, reopened, synchronize, edited]
  issues:
    types: [assigned, unassigned]

permissions:
  contents: read

jobs:
  claim:
    name: claim
    if: github.repository == 'phmilk/reforged-ts-template'
    # The called jobs can only lower these: the checkout, the assignment and
    # the comment on the issue, the comment on the pull request (the check),
    # and the dispatch of board.yml after an assignment (the dispatch job,
    # the one that holds actions: write). That job runs in the library only,
    # but a called workflow may not declare a permission its caller does not
    # grant: without actions: write here, the run fails at startup.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    uses: phmilk/reforged-ts/.github/workflows/claim-check.yml@master
